[CNC]
# IP-адрес стойки ЧПУ OSAI COMPACT
host = 192.168.0.2
# Сетевой порт SMB (445 для прямого TCP)
port = 445
# Имя NetBIOS стойки (для совместимости)
remote_name = COMPACT
# Имя клиента
client_name = OPERATOR-PC
# Основной рабочий сетевой ресурс (USER или OEM)
share = USER
# Стартовый каталог на ЧПУ
remote_dir = /PROGRAMS/WORK
# Таймаут сокета в секундах
timeout = 5
# Авторизация (на WinCE пустой логин и любой непустой пароль)
username = 
password = 123

[Local]
# Начальная папка на ПК оператора (пусто = рабочий стол или D:\Раскрой)
default_path = C:\Users\OEM\Desktop
# Фильтр расширений файлов УП (включая .anc станка Нестинг)
extensions = *.anc;*.cnc;*.pgm;*.txt;*.nc

[App]
# Тема оформления: dark или light
theme = light
# Интервал фоновой проверки связи со станком (секунды)
ping_interval = 5
